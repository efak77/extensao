<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Centralizado de Veículo e Pessoa</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <h3> Formulário de Acesso</h3>

        <form id="loginForm" action="acesso.html" method="GET">
        
        <div>
            <label for="placa">Placa do Carro:</label>
            <input 
                type="text" 
                id="placa" 
                name="placa" 
                placeholder="Ex: ABC1234 ou AAA1A11"
                maxlength="7"
                required
            >
        </div>

        <div>
            <label for="cpf">CPF (Cadastro de Pessoa Física):</label>
            <input 
                type="text" 
                id="cpf" 
                name="cpf" 
                placeholder="Ex: 000.000.000-00"
                maxlength="14"
                required
            >
        </div>

        <button type="submit">acessar</button>
        
        <p id="message"></p>

    </form>
</body>
</html>
